
name: Android OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "App.js"
      - "index.js"
      - "src/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ota-preview
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Block native configuration changes
        id: safety
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^(app\.json|eas\.json|package\.json|package-lock\.json|android/|ios/|plugins/)'; then
            echo "Native/config changes detected. Skipping OTA."
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.safety.outputs.safe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.safety.outputs.safe == 'true'
        run: npm ci

      - name: Setup Expo and EAS
        if: steps.safety.outputs.safe == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        if: steps.safety.outputs.safe == 'true'
        run: eas update --channel preview --environment preview --message "GitHub $GITHUB_SHA" --non-interactive
